apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: alerts
  namespace: system
  labels:
    app.kubernetes.io/name: fraud
    app.kubernetes.io/managed-by: kustomize
spec:
  groups:
    - name: fraud-operator
      interval: 30s
      rules:
        - alert: FraudOperatorDown
          expr: |
            up{job="fraud-controller-manager-metrics-service"} == 0
          for: 5m
          labels:
            severity: critical
            service: fraud
            team: platform
          annotations:
            summary: "Fraud operator is down"
            description: "The fraud operator has been unreachable for 5+ minutes. Fraud evaluations will not be processed."

        - alert: FraudProviderHighErrorRate
          expr: |
            (
              sum by (provider) (rate(fraud_provider_call_duration_seconds_count{result="failure"}[5m]))
              /
              sum by (provider) (rate(fraud_provider_call_duration_seconds_count[5m]))
            ) > 0.1
          for: 5m
          labels:
            severity: critical
            service: fraud
            team: platform
          annotations:
            summary: "High error rate for fraud provider {{ $labels.provider }}"
            description: "{{ $value | humanizePercentage }} of calls to provider {{ $labels.provider }} are failing. With FailClosed policy, evaluations will be blocked until this is resolved."

        - alert: FraudProviderHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (provider, le) (rate(fraud_provider_call_duration_seconds_bucket{result="success"}[5m]))
            ) > 5
          for: 5m
          labels:
            severity: warning
            service: fraud
            team: platform
          annotations:
            summary: "High latency for fraud provider {{ $labels.provider }}"
            description: "P99 latency for provider {{ $labels.provider }} is {{ $value }}s, exceeding the 5s threshold."

        - alert: FraudEvaluationHighReconcileErrors
          expr: |
            (
              sum(rate(controller_runtime_reconcile_errors_total{controller="fraudevaluation"}[5m]))
              /
              sum(rate(controller_runtime_reconcile_total{controller="fraudevaluation"}[5m]))
            ) > 0.1
          for: 10m
          labels:
            severity: warning
            service: fraud
            team: platform
          annotations:
            summary: "High reconciliation error rate for fraud evaluations"
            description: "{{ $value | humanizePercentage }} of fraud evaluation reconciliations are failing."

    - name: fraud-evaluations
      interval: 30s
      rules:
        - alert: FraudEvaluationsStuckInError
          expr: |
            count(fraud_evaluation_info{phase="Error"}) > 0
          for: 15m
          labels:
            severity: warning
            service: fraud
            team: platform
          annotations:
            summary: "Fraud evaluations stuck in Error phase"
            description: "{{ $value }} fraud evaluation(s) have been in the Error phase for 15+ minutes. This may indicate a persistent provider failure or misconfiguration."

        - alert: FraudEvaluationDegraded
          expr: |
            fraud_evaluation_status_condition{condition="Degraded"} == 1
          for: 5m
          labels:
            severity: warning
            service: fraud
            team: platform
          annotations:
            summary: "Fraud evaluation {{ $labels.name }} is degraded"
            description: "Fraud evaluation {{ $labels.name }} has been in a degraded state for 5+ minutes, indicating one or more providers returned errors during evaluation."

        - alert: FraudEvaluationUserDeactivatedOrReview
          expr: |
            max by (name, user_ref, decision) (fraud_evaluation_info{decision=~"DEACTIVATE|REVIEW"}) == 1
          for: 0m
          labels:
            severity: warning
            slack_channel: user-bot
            service: fraud
            team: platform
          annotations:
            summary: "Fraud check returned {{ $labels.decision }} for user {{ $labels.user_ref }}"
            description: "FraudEvaluation {{ $labels.name }} returned decision={{ $labels.decision }} for user {{ $labels.user_ref }}. Review the user and take action if needed."
